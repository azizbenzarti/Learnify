apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: learnify
  labels:
    io.kompose.service: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: user-service
  template:
    metadata:
      labels:
        io.kompose.service: user-service
    spec:
      containers:
        - name: user-service
          image: azizbenzarti74/user-service:latest
          ports:
            - containerPort: 3000
              hostPort: 3000
          env:
            - name: BASE_URL
              value: http://user-service:3000
            - name: FRONTEND_URL
              value: http://frontend:3001
            - name: MONGO_URL
              value: mongodb://mongo:27017/learnify
            - name: PORT
              value: "3000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: global-secrets
                  key: JWT_SECRET
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: global-secrets
                  key: GMAIL_USER
            - name: GMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: global-secrets
                  key: GMAIL_PASS
            - name: CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: cloudinary-user-secrets
                  key: CLOUDINARY_CLOUD_NAME
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudinary-user-secrets
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudinary-user-secrets
                  key: CLOUDINARY_SECRET_KEY
