apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
  namespace: learnify
  labels:
    io.kompose.service: course-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: course-service
  template:
    metadata:
      labels:
        io.kompose.service: course-service
    spec:
      containers:
        - name: course-service
          image: azizbenzarti74/course-service:latest
          ports:
            - containerPort: 5000
              hostPort: 5000
          env:
            - name: FRONTEND_URL
              value: http://frontend:3001
            - name: MONGO_URL
              value: mongodb://mongo:27017/learnify
            - name: PORT
              value: "5000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: global-secrets
                  key: JWT_SECRET
            - name: CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: cloudinary-course-secrets
                  key: CLOUDINARY_CLOUD_NAME
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudinary-course-secrets
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudinary-course-secrets
                  key: CLOUDINARY_API_SECRET
