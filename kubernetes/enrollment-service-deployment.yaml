apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrollment-service
  namespace: learnify
  labels:
    io.kompose.service: enrollment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: enrollment-service
  template:
    metadata:
      labels:
        io.kompose.service: enrollment-service
    spec:
      containers:
        - name: enrollment-service
          image: azizbenzarti74/enrollment-service:latest
          ports:
            - containerPort: 5001
              hostPort: 5001
          env:
            - name: COURSE_SERVICE_URL
              value: http://course-service:5000
            - name: FRONTEND_URL
              value: http://frontend:3001
            - name: MONGO_URL
              value: mongodb://mongo:27017/learnify
            - name: PORT
              value: "5001"
            - name: USER_SERVICE_URL
              value: http://user-service:3000
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: global-secrets
                  key: JWT_SECRET
